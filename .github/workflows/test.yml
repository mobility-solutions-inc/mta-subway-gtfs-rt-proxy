name: lint & test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  # make this workflow callable from other workflows
  workflow_call:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: upgrade CA certificates
        # Distrust the compromised eMudhra intermediates (Mozilla bug 2083449) before anything
        # downloads over TLS. pnpm 12 (Rust) and curl use the system CA store.
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg-query -W ca-certificates
          test ! -e /etc/ssl/certs/emSign_ECC_Root_CA_-_G3.pem
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: cd postgis-gtfs-importer && pnpm install --prod --ignore-workspace --no-lockfile

      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm run typecheck

      - name: install prerequisites
        # - curl, jq, unzip & wget are needed for the qsv download script below
        # - moreutils provides sponge, which is needed by postgis-gtfs-importer & test/02-service-prepare.sh
        run: |
          sudo apt install -y \
            curl \
            jq \
            moreutils \
            unzip \
            wget
      - name: install qsv
        # see also https://api.github.com/repos/jqnatividad/qsv/releases
        run: |
          set -eu -o pipefail
          ua='mta-gtfs-rt-consolidation-service CI'
          assets="$(curl 'https://api.github.com/repos/jqnatividad/qsv/releases/latest' -H "User-Agent: $ua" -fsSL | jq -rc '.assets')"
          set -x
          zip_url="$(echo "$assets" | jq -rc '.[] | [.name, .browser_download_url]' | grep -i '\blinux-musl\b' | grep "$(uname -m)" | head -n 1 | jq -rc '.[1]')"
          wget -nv -U "$ua" -O /tmp/qsv.zip "$zip_url"
          unzip -n -d /usr/local/bin /tmp/qsv.zip qsv
          chmod +x /usr/local/bin/qsv
          qsv --version
      - name: start PostgreSQL with PostGIS
        run: |
          docker run -d -q \
            -e POSTGRES_USER=$PGUSER -e POSTGRES_PASSWORD=$PGPASSWORD -e POSTGRES_DB=$PGDATABASE \
            -p 5432:5432 postgis/postgis:17-3.5-alpine@sha256:2db2d29dbde9379103076851c39f50f4fd9c7ee4297251ed006ed94d586df958
        env:
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: postgres

      - run: pnpm run build
      - name: install curl-mirror script
        run: |
          set -eux -o pipefail
          ln -s $PWD/curl-mirror.mjs /usr/local/bin/curl-mirror
          curl-mirror --help

      - name: run tests
        run: sleep 5 && pnpm test
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: password
          # more verbose service logging to be able to analyze why tests fail
          LOG_LEVEL: trace
          LOG_LEVEL_SERVICE: debug
          LOG_LEVEL_TEST: trace
          LOG_LEVEL_MATCHING: debug
          LOG_LEVEL_SCHEDULE_DATA: debug
